# xLights Cloud: the official xLights plus Backup to Cloud / Restore from Cloud.
#
# Every day this checks the official project (xLightsSequencer/xLights):
#   * a trial merge of its master into this branch: on a conflict it opens an
#     issue here, so the conflict is fixed long before the next release;
#   * its newest release tag (2026.19, ...): when there is no "<version>-cloud"
#     release yet, it applies this branch's changes onto that exact tag, builds
#     the Windows installer and the Linux AppImage and publishes both as
#     release "<version>-cloud". The Windows installer is published even when
#     the Linux build fails.
#
# The official project's own workflows are turned off in this fork on every run.

name: xLights Cloud

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Official version to build, e.g. 2026.19 (empty = newest)'
        required: false
        default: ''
      rebuild:
        description: 'Build again even when that release exists (replaces its installer)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: xlights-cloud
  cancel-in-progress: false

env:
  UPSTREAM_REPO: xLightsSequencer/xLights
  GH_REPO: ${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      build: ${{ steps.pick.outputs.build }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout xLights Cloud
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Turn off the official project's workflows
        run: |
          gh api "repos/$GH_REPO/actions/workflows" --paginate \
            --jq '.workflows[] | select(.state == "active") | select(.path | startswith(".github/workflows/")) | select(.path != ".github/workflows/xlights-cloud.yml") | "\(.id) \(.path)"' |
          while read -r id path; do
            gh api -X PUT "repos/$GH_REPO/actions/workflows/$id/disable" && echo "Disabled $path"
          done

      - name: Fetch the official project
        run: |
          git config user.name "xLights Cloud bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags --no-recurse-submodules "https://github.com/$UPSTREAM_REPO.git" \
            '+refs/heads/master:refs/remotes/upstream/master' \
            '+refs/tags/*:refs/upstream-tags/*'

      - name: Check that the official master still merges
        run: |
          title="Merge conflict with the official xLights master"
          open=$(gh issue list --state open --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if git merge --no-commit --no-ff upstream/master > /dev/null 2>&1; then
            git merge --abort 2> /dev/null || git reset --hard -q
            echo "The official master merges cleanly."
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "The official master merges cleanly again ($(git rev-parse --short upstream/master))."
            fi
          else
            files=$(git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/')
            git merge --abort 2> /dev/null || git reset --hard -q
            body=$(printf 'Merging the official master (%s) into `%s` conflicts on:\n\n%s\n\nMerge it locally, fix the conflicts and push:\n\n```\ngit fetch https://github.com/%s.git master\ngit merge FETCH_HEAD\n```\n\nReleases still build while this is open, as long as these changes apply onto the release tag.' \
              "$(git rev-parse --short upstream/master)" "$GITHUB_REF_NAME" "$files" "$UPSTREAM_REPO")
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "$body"
            else
              gh issue create --title "$title" --body "$body"
            fi
            echo "::warning::The official master conflicts with this branch"
          fi

      # New official tips show in English in the French tips window until they
      # are translated, so the French list follows the official one every day.
      - name: Refresh the French tips list
        if: github.ref_name == 'xlights-cloud'
        run: |
          git show upstream/master:TipOfDay/tod.xml > "$RUNNER_TEMP/tod.xml"
          python3 ci_scripts/xlights_cloud_tips.py "$RUNNER_TEMP/tod.xml" "$RUNNER_TEMP/untranslated.md"
          if ! git diff --quiet -- TipOfDay/fr/tod.xml; then
            git add TipOfDay/fr/tod.xml
            git commit -q -m "Refresh the French tips list from the official tips"
            git push -q origin "HEAD:$GITHUB_REF_NAME"
            echo "French tips list updated."
          fi

      # One issue lists the official tips that have no French page yet: it is
      # opened (or commented on, for each new tip) so GitHub notifies you, and
      # closed once every tip is translated again.
      - name: Report tips to translate
        if: github.ref_name == 'xlights-cloud'
        run: |
          title="Astuces à traduire en français"
          list="$RUNNER_TEMP/untranslated.md"
          open=$(gh issue list --state open --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          intro=$(printf 'Ces astuces du jour officielles n%sont pas encore de page française : elles s%saffichent en anglais dans la fenêtre française.\n\nTraduisez-les dans `TipOfDay/fr/` (même nom de fichier, voir `resources/locale/fr/GLOSSARY.md`).\n\n' "'" "'")
          if [ -s "$list" ]; then
            body="$intro$(cat "$list")"
            if [ -z "$open" ]; then
              gh issue create --title "$title" --body "$body"
            else
              old=$(gh issue view "$open" --json body --jq .body)
              new_lines=$(grep -vxF -f <(printf '%s\n' "$old") "$list" || true)
              if [ -n "$new_lines" ]; then
                gh issue edit "$open" --body "$body"
                gh issue comment "$open" --body "$(printf 'Nouvelles astuces à traduire :\n\n%s' "$new_lines")"
              fi
            fi
            echo "::notice::$(grep -c . "$list") tip(s) to translate"
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Toutes les astuces officielles ont maintenant une page française."
          fi

      - name: Pick the version to build
        id: pick
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version=$(git for-each-ref --format='%(refname:lstrip=2)' refs/upstream-tags/ |
                      grep -E '^[0-9]{4}\.[0-9]+(\.[0-9]+)?$' | sort -V | tail -1)
          fi
          if ! git rev-parse -q --verify "refs/upstream-tags/$version^{commit}" > /dev/null; then
            echo "::error::No official tag '$version'"
            exit 1
          fi
          build=true
          if gh release view "$version-cloud" > /dev/null 2>&1 && [ "${{ inputs.rebuild }}" != "true" ]; then
            build=false
            echo "Release $version-cloud already exists."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Official version: $version, build: $build"

      - name: Apply xLights Cloud onto the official version
        if: steps.pick.outputs.build == 'true'
        run: |
          version="${{ steps.pick.outputs.version }}"
          base=$(git merge-base HEAD upstream/master)
          git diff --binary "$base" HEAD > "$RUNNER_TEMP/feature.patch"
          # Changes to files this version does not have yet (features the
          # xLights team added after the tag) are left out.
          excludes=()
          skipped=""
          for f in $(git diff --name-only --diff-filter=M "$base" HEAD); do
            if ! git cat-file -e "refs/upstream-tags/$version:$f" 2> /dev/null; then
              excludes+=("--exclude=$f")
              skipped="$skipped $f"
            fi
          done
          [ -n "$skipped" ] && echo "::notice::Not in $version, left out:$skipped"
          git checkout -q --detach "refs/upstream-tags/$version"
          applied=true
          git apply --3way --index "${excludes[@]}" "$RUNNER_TEMP/feature.patch" 2> "$RUNNER_TEMP/apply.log" || applied=false
          if ! $applied && ! grep -qE '^error:' "$RUNNER_TEMP/apply.log"; then
            # Conflicts where the xLights team changed, after the tag, lines the
            # branch only translates (or got from the official master): keep the
            # release's lines there (they stay in English in this build) and
            # apply the rest. A conflict on lines of the branch's own features
            # (cloud backup...) still stops the build.
            conflicted=$(git diff --name-only --diff-filter=U)
            if [ -n "$conflicted" ] && python3 "$GITHUB_WORKSPACE/ci_scripts/xlights_keep_release_in_conflicts.py" --check "$base" "$GITHUB_SHA" $conflicted; then
              python3 ci_scripts/xlights_keep_release_in_conflicts.py $conflicted
              git add $conflicted
              echo "::notice::Kept the release's lines where the translation conflicts:" $conflicted
              applied=true
            fi
          fi
          if ! $applied; then
            cat "$RUNNER_TEMP/apply.log"
            title="xLights Cloud does not apply onto $version"
            files=$(git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/')
            errors=$(grep -E '^error:' "$RUNNER_TEMP/apply.log" | head -20)
            gh issue create --title "$title" \
              --body "$(printf 'Applying `%s` (%s) onto the official tag `%s` failed.\n\nConflicts:\n\n%s\n\nErrors:\n\n```\n%s\n```\n\nRun the workflow again once the branch is fixed.' "$GITHUB_REF_NAME" "${GITHUB_SHA::9}" "$version" "$files" "$errors")" || true
            exit 1
          fi
          # Bring the French catalog in line with this version's sources: list
          # the new texts, and clear translations the new code reads back as
          # English (they would break a feature) before they reach the build.
          cp resources/locale/fr/xlights.po "$RUNNER_TEMP/previous.po"
          python3 ci_scripts/xlights_i18n.py extract
          python3 ci_scripts/xlights_i18n.py update
          python3 ci_scripts/xlights_i18n_check.py fr "$RUNNER_TEMP/previous.po" "$RUNNER_TEMP/i18n-report.md"
          python3 ci_scripts/xlights_i18n.py compile
          git add -A resources/locale
          git diff --cached --binary "refs/upstream-tags/$version" > "$RUNNER_TEMP/release.patch"
          git diff --cached --stat "refs/upstream-tags/$version" | tail -1

      # One issue collects, release after release, the new interface texts to
      # translate and the translations turned off because the code now reads
      # them as English. GitHub notifies whoever watches the repository.
      - name: Report interface texts to translate
        if: steps.pick.outputs.build == 'true'
        run: |
          report="$RUNNER_TEMP/i18n-report.md"
          [ -s "$report" ] || { echo "Nothing to translate in this version."; exit 0; }
          title="Textes de l'interface à traduire"
          body=$(printf '## xLights %s\n\n%s' "${{ steps.pick.outputs.version }}" "$(cat "$report")")
          open=$(gh issue list --state open --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -z "$open" ]; then
            gh issue create --title "$title" --body "$body"
          else
            gh issue comment "$open" --body "$body"
          fi

      - name: Keep the release patch
        if: steps.pick.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-patch
          path: ${{ runner.temp }}/release.patch
          retention-days: 7

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-2025-vs2026
    # The OIDC token subject (repo:<this repo>:environment:signing) is what the
    # Entra federated credential trusts for Azure Artifact Signing. Signing runs
    # only when the SIGNING_ENABLED repository variable is 'true'; until then the
    # release is built unsigned.
    environment: signing
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      SIGN: ${{ vars.SIGNING_ENABLED == 'true' }}
    steps:
      - name: Checkout the official xLights ${{ needs.check.outputs.version }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: refs/tags/${{ needs.check.outputs.version }}
          submodules: 'true'

      - name: Get the release patch
        uses: actions/download-artifact@v4
        with:
          name: release-patch
          path: ${{ runner.temp }}

      - name: Apply xLights Cloud
        shell: bash
        run: git apply --binary --whitespace=nowarn "$RUNNER_TEMP/release.patch" && git status --short | tail -5

      - name: Setup msbuild
        uses: microsoft/setup-msbuild@v3

      - name: install ISPC
        uses: ispc/install-ispc-action@main
        with:
          version: 1.31.0

      # glslc (Vulkan SDK) compiles the compute kernels in the xLights.vcxproj pre-build step.
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: false
          cache: true

      # Release downloads from GitHub sometimes answer 504. fetch_dependencies
      # skips what is already staged, so retrying here leaves Build All with
      # nothing left to download.
      - name: Fetch dependencies (with retries)
        shell: pwsh
        run: |
          # GitHub release downloads sometimes return 504 for several minutes:
          # 8 attempts spread over about 35 minutes.
          for ($i = 1; $i -le 8; $i++) {
            powershell -NoProfile -ExecutionPolicy Bypass -File ci_scripts\fetch_dependencies.ps1
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($i -eq 8) { break }
            Write-Host "::warning::Dependency download failed (attempt $i of 8), retrying in $(60 * $i) s"
            Start-Sleep -Seconds (60 * $i)
          }
          exit 1

      - name: Build All
        shell: cmd
        working-directory: build_scripts\msw
        run: call build_VS_x64.cmd

      # --- Authenticode signing via Azure Artifact Signing ----------------------
      # Same steps as the official release workflow: our executables, then the
      # bundled DLLs that have no vendor signature (Windows 11 Smart App Control
      # refuses unsigned DLLs, see xLights #7044), then the installer.
      - name: Azure login (OIDC)
        if: env.SIGN == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign xLights.exe
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: xlights\x64\Release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com

      - name: Sign xlDo.exe
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: xlDo\x64\Release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com

      - name: Sign fseq_convert.exe
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: fseq_convert\cmake_vs\Release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com

      - name: List unsigned bundled DLLs
        id: unsigned_dlls
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $unsigned = Get-ChildItem bin64\*.dll | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' } | ForEach-Object { $_.Name }
          Set-Content -Path bin64\sign-catalog.txt -Value $unsigned
          "Signing: $($unsigned -join ', ')"
          "count=$($unsigned.Count)" >> $env:GITHUB_OUTPUT

      - name: Sign bundled DLLs
        if: env.SIGN == 'true' && steps.unsigned_dlls.outputs.count != '0'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-catalog: bin64\sign-catalog.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com

      - name: Build the xLights Cloud installer
        working-directory: build_scripts\msw
        run: |
          python xlights_cloud_installer.py $env:VERSION
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ISCC.exe xLights_Cloud_64bit.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem output\*.exe | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files-folder: build_scripts\msw\output
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com

      - name: Check the signatures
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem xLights\x64\Release\xLights.exe, build_scripts\msw\output\*.exe)
          $bad = 0
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            "{0}: {1} ({2})" -f $f.Name, $s.Status, $s.SignerCertificate.Subject
            if ($s.Status -ne 'Valid') { $bad++ }
          }
          if ($bad) { exit 1 }

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: xLights_Cloud_Installer
          path: build_scripts\msw\output\*.exe
          retention-days: 14

      - name: Publish the release
        shell: bash
        run: |
          tag="$VERSION-cloud"
          installer=$(ls build_scripts/msw/output/*.exe)
          # The Linux job publishes after this one; on a rebuild the release
          # may already hold an AppImage.
          LINUX=false
          if gh release view "$tag" --json assets --jq '.assets[].name' 2> /dev/null | grep -q '\.AppImage$'; then
            LINUX=true
          fi
          export LINUX
          python ci_scripts/xlights_cloud_release_notes.py "$VERSION" "$RUNNER_TEMP/notes.md"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$installer" --clobber
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$tag" "$installer" --target "$GITHUB_SHA" \
              --title "xLights Cloud $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest
          fi

  # Linux AppImage, built like the official one (Ubuntu_Window_Release.yml) but
  # from the official tag with xLights Cloud applied. It runs next to the
  # Windows build and never holds it up: a failure here only opens an issue.
  build-linux:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      BUILD_IMAGE: ghcr.io/xlightssequencer/xlights-build-docker:master
    steps:
      - name: Checkout the official xLights ${{ needs.check.outputs.version }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: refs/tags/${{ needs.check.outputs.version }}
          submodules: 'true'

      - name: Get the release patch
        uses: actions/download-artifact@v4
        with:
          name: release-patch
          path: ${{ runner.temp }}

      - name: Apply xLights Cloud
        run: git apply --binary --whitespace=nowarn "$RUNNER_TEMP/release.patch" && git status --short | tail -5

      - name: Build the AppImage
        run: |
          docker pull "$BUILD_IMAGE"
          docker run --name buildvm -v "$GITHUB_WORKSPACE:/xLights/xlights-git" -e XLIGHTS_VERSION="$VERSION" \
            "$BUILD_IMAGE" /bin/bash /xLights/xlights-git/build_scripts/linux/xlights_cloud_appimage.sh
          docker cp buildvm:/xLights/xLights/AppImage/. "$RUNNER_TEMP/AppImage/"
          mkdir -p "$RUNNER_TEMP/out"
          mv "$RUNNER_TEMP"/AppImage/*.AppImage "$RUNNER_TEMP/out/xLightsCloud-$VERSION-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/out/xLightsCloud-$VERSION-x86_64.AppImage"
          ls -lh "$RUNNER_TEMP/out"

      # French catalogs in place, libraries bundled, and a start in French on a
      # machine without a screen or keyring (as on a headless Ubuntu VM).
      - name: Check the AppImage
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb imagemagick libgl1 libegl1 libglu1-mesa libgl1-mesa-dri > /dev/null
          bash build_scripts/linux/xlights_cloud_smoke_test.sh "$RUNNER_TEMP/out/xLightsCloud-$VERSION-x86_64.AppImage" "$RUNNER_TEMP/check"

      - name: Keep the screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xLights_Cloud_Linux_check
          path: ${{ runner.temp }}/check
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: xLights_Cloud_AppImage
          path: ${{ runner.temp }}/out/*.AppImage
          retention-days: 14

      - name: Report the failure
        if: failure()
        run: |
          title="Linux AppImage build failed"
          body=$(printf 'The Linux AppImage of xLights Cloud %s (`%s`) failed: %s/%s/actions/runs/%s\n\nThe Windows installer is published as usual. If this release already had an AppImage, it is the one from an earlier build.' \
            "$VERSION" "${GITHUB_SHA::9}" "$GITHUB_SERVER_URL" "$GH_REPO" "$GITHUB_RUN_ID")
          open=$(gh issue list --state open --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  # Adds the AppImage to the release the Windows job published.
  publish-linux:
    needs: [check, build, build-linux]
    if: needs.build.result == 'success' && needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      SIGN: ${{ vars.SIGNING_ENABLED == 'true' }}
      LINUX: 'true'
    steps:
      - name: Checkout xLights Cloud
        uses: actions/checkout@v4
        with:
          sparse-checkout: ci_scripts

      - name: Get the AppImage
        uses: actions/download-artifact@v4
        with:
          name: xLights_Cloud_AppImage
          path: ${{ runner.temp }}/out

      - name: Publish the AppImage
        run: |
          tag="$VERSION-cloud"
          python3 ci_scripts/xlights_cloud_release_notes.py "$VERSION" "$RUNNER_TEMP/notes.md"
          gh release upload "$tag" "$RUNNER_TEMP"/out/*.AppImage --clobber
          gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          title="Linux AppImage build failed"
          open=$(gh issue list --state open --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$open" ]; then
            gh issue close "$open" --comment "The AppImage of xLights Cloud $VERSION is published again."
          fi
